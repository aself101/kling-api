name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (incl. import-graph zones)
        run: npm run lint

      - name: Import cycles
        run: npm run check:cycles

      - name: Build
        run: npm run build

      - name: Package layout (spec V8)
        run: |
          test -f dist/index.js && test -f dist/cli/index.js
          test ! -e dist/api.js && test ! -e dist/auth.js && test ! -e dist/cli.js
          npm pack --dry-run 2>&1 | grep -q 'dist/index.js'

      - name: Run tests
        run: npm test

      - name: Check types
        run: npx tsc --noEmit
